[workspace]
members  = ["crates/*", "clients/tui", "clients/iced"]
resolver = "3"

[workspace.package]
edition      = "2024"
repository   = "https://github.com/chrisppy/pressbox"
rust-version = "1.89"
version      = "0.1.0"

[workspace.lints.rust]
# `#[cfg(not(tarpaulin_include))]` marks code `just coverage` leaves out of
# its count; each use says why.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
