[package]
description            = "Desktop client for pressbox, built with iced"
edition.workspace      = true
license                = "GPL-3.0-only"
name                   = "pressbox-iced"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
gstreamer = "0.23"
html2text = "0.17.4"
iced = { version = "0.14.0", features = ["tokio"] }
iced_video_player = "0.6.0"
open = "5"
pressbox-api = { path = "../../crates/pressbox-api" }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "gzip",
  "json",
  "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = { version = "0.9.3", default-features = false, features = [
  "use_zbus",
] }
tokio = { version = "1", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
iced_runtime = "0.14.0"
iced_test    = "0.14.0"
tokio        = { version = "1", features = ["macros", "rt", "time"] }
