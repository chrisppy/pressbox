[package]
description            = "pressbox RSS/Atom aggregation server"
edition.workspace      = true
license                = "AGPL-3.0-only"
name                   = "pressboxd"
publish                = false
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dom_query = "0.29"
dom_smoothie = "0.19"
feed-rs = "3.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
pressbox-api = { path = "../pressbox-api" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
] }
roxmltree = "0.21.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1.2.1"
tower-http = { version = "0.6.11", default-features = false, features = [
  "compression-br",
  "compression-gzip",
] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tower          = { version = "0.5.3", features = ["util"] }
