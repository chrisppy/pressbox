# cargo-deny (https://embarkstudios.github.io/cargo-deny/): run in CI by
# .github/workflows/deny.yml, or locally with `cargo deny check`.

[graph]
all-features = true

[licenses]
# Licenses dependencies may use: only those in use today, all compatible
# with linking into the AGPL-3.0-only server and the GPL-3.0-only clients.
# Anything else fails CI until someone checks it and adds it here.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are not published; their licenses are checked by REUSE.
ignore = true

[advisories]
# Every RustSec advisory fails, including unmaintained and unsound crates
# however deep in the tree (cargo-deny only reports unsound ones you depend
# on directly unless told) and yanked versions, unless listed in `ignore`
# with a reason. So this covers what `cargo audit` reports.
ignore = [
  # Unmaintained, no replacement yet; all come in through iced 0.14 for
  # pressbox-iced only. Drop each once an iced release moves off it.
  { id = "RUSTSEC-2024-0436", reason = "paste, a proc-macro used by wgpu's Metal backend (macOS)" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via cosmic-text and fontdb" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, folded into zbus; via mundy (dark mode)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, folded into zbus; via mundy (dark mode)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, folded into zbus; via mundy (dark mode)" },
  # Unsound, fixed only in lru 0.18; iced 0.14's text renderer (cryoglyph,
  # one release so far) is on 0.16. Needs a key whose Drop panics, caught
  # with catch_unwind; cryoglyph's glyph keys are plain data.
  { id = "RUSTSEC-2026-0253", reason = "lru, via cryoglyph (iced's glyph cache); keys can't panic on drop" },
]
unmaintained = "all"
unsound = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# Our own crates depend on each other by path.
allow-wildcard-paths = true

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
