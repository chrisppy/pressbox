name: cargo-deny

on:
  push:
    branches: [master]
  pull_request:
  # New advisories appear for crates already in Cargo.lock, so check weekly
  # even when nothing changes.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    # A new advisory should not block unrelated pull requests.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features
